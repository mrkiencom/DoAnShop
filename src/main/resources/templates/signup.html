            </div>

            <input class="border-b border-gray-300 focus:border-black outline-none py-1" placeholder="Password" required="" type="password" th:field="*{password}"/>

            <p class="text-[10px] text-gray-600 mt-6 max-w-xs w-full text-center select-none">
