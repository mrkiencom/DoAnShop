<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>
        Huge LMS Dashboard
    </title>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;display=swap" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <style>
        @keyframes slide-up {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .animate-slide-up {
            animation: slide-up 0.4s ease-out;
        }

        @keyframes pulseDot {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.5);
            }
        }

        .animate-pulse-dot {
            animation: pulseDot 1s infinite;
        }
    </style>
</head>
<body class="bg-white text-gray-900">
<div class="flex min-h-screen">
    <!-- Sidebar -->
    <aside th:replace="~{fragments/sidebar_lecturer :: sidebar_lecturer}"></aside>
    <!-- Main content -->
    <main class="flex-1 p-6">
        <header th:replace="~{fragments/header_lecturer :: header_lecturer}"></header>
        <div>
            <nav class="flex items-center space-x-6 border-b border-gray-200 mb-6 justify-between">
                <button aria-current="page"
                        class="flex items-center space-x-2 pb-3 border-b-2 border-black text-black font-semibold text-sm">
                    <span>My Course</span>
                    <span class="bg-gray-200 text-gray-600 text-xs font-semibold rounded-md px-2 py-0.5"
                          th:attr="data-total=${courses.totalElements}"
                          th:text="${courses.totalElements}">0</span>
                </button>
                <div class="ml-auto flex items-center space-x-4">
                    <a class="mr-4 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-md px-4 py-2 focus:outline-none"
                       href="/createCourses">
                        + CREATE
                    </a>
                </div>
            </nav>
            <div id="course-table-wrapper">
                <div class="overflow-x-auto border border-gray-200 rounded-md">
                    <div class="relative overflow-y-auto ">
                        <div th:if="${courses.content.isEmpty()}"
                             class="flex flex-col items-center justify-center py-12 text-gray-500">
                            <i class="fas fa-book-open text-4xl mb-4 text-gray-400"></i>
                            <p class="text-lg font-medium">Không có khóa học nào.</p>
                        </div>
                        <table th:unless="${courses.content.isEmpty()}" class="min-w-full divide-y divide-gray-200">
                            <thead class="bg-white sticky top-0 z-10">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider"
                                    scope="col">
                                    COURSE
                                </th>
                                <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider"
                                    scope="col">
                                    CATEGORY
                                </th>
                                <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider"
                                    scope="col">
                                    TOPIC
                                </th>
                                <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider"
                                    scope="col">
                                    PRICE
                                </th>
                                <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider"
                                    scope="col">
                                    LEVEL
                                </th>
                                <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider"
                                    scope="col">
                                    STATUS
                                </th>
                                <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider"
                                    scope="col">
                                    ACTION
                                </th>
                            </tr>
                            </thead>
                            <tbody class="bg-white divide-y divide-gray-100 text-sm">
                            <tr th:each="course : ${courses.content}">
                                <td class="px-6 py-4 whitespace-nowrap flex items-center space-x-4">
                                    <img alt="Blue abstract UI/UX design image for course" class="w-10 h-10 rounded"
                                         height="40" th:src="${course.image}" width="40"/>
                                    <span th:text="${course.title}"
                                          class="font-semibold text-gray-900 block truncate w-48"></span>
                                </td>
                                <td th:text="${course.category}" class="px-6 py-4 whitespace-nowrap text-gray-500"></td>
                                <td th:text="${course.topic}" class="px-6 py-4 whitespace-nowrap text-gray-500"></td>
                                <td th:text="${course.price}"
                                    th:id="'coursePrice-' + ${course.courseId}"
                                    class="px-6 py-4 whitespace-nowrap text-gray-500"></td>
                                <td th:text="${course.level}" class="px-6 py-4 whitespace-nowrap text-gray-500"></td>
                                <td class="px-3 py-4 whitespace-nowrap">
              <span class="inline-flex items-center space-x-1 text-xs font-semibold rounded-md px-2 py-1"
                    th:classappend="${course.status == 'Published' ? 'bg-green-100 text-green-700' :
                                   (course.status == 'Waiting' ? 'bg-yellow-100 text-yellow-700' : 'bg-red-100 text-red-700')}">
              <svg aria-hidden="true" class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2"
                   viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path th:if="${course.status == 'Published'}" d="M5 13l4 4L19 7" stroke-linecap="round"
                      stroke-linejoin="round"></path>
                <path th:if="${course.status == 'Waiting'}"
                      d="M12 3v1m8 8h-1m-9 8v-1m2 1h-2M6 11V9m14 0v2m-3 4h1m-11 0h1m4-2v2m-4-2v2m-9-4h1m3 0h-3m0-6h1m-2 0h1m9-2v1m-7 0v1m-3 0h1m-1 0h1m2-2v2m-2-2v2M5 19h12a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                <path th:if="${course.status == 'Drafted'}" d="M6 18L18 6M6 6l12 12" stroke-linecap="round"
                      stroke-linejoin="round"></path>
              </svg>
              <span th:text="${course.status}"></span>
              </span>
                                </td>
                                <td class="py-3 pr-4 text-center">
                                    <a aria-label="Edit 1" class="text-blue-800 hover:text-blue-600"
                                       th:href="@{/updateCourses/{courseId}(courseId=${course.courseId})}">
                                        <i class="fas fa-edit"></i>
                                    </a>
                                    <a aria-label="Delete 1" class="text-red-800 hover:text-red-600 ml-2"
                                       th:href="@{/deleteCourses/{courseId}(courseId=${course.courseId})}">
                                        <i class="fas fa-trash-alt"></i>
                                    </a>
                                </td>
                            </tr>
                            <script th:inline="javascript">
                                // Get all course price elements
                                document.querySelectorAll('[id^="coursePrice-"]').forEach(element => {
                                    const price = Number(element.textContent.replace(' ₫', '')) || 0;
                                    element.textContent = new Intl.NumberFormat('vi-VN', {
                                        style: 'currency',
                                        currency: 'VND'
                                    }).format(price);
                                });
                            </script>
                            </tbody>
                        </table>
                        <!-- Pagination -->
                        <div class="flex items-center justify-end mt-4 px-6 py-2 space-x-2 text-sm">
                            <a th:if="${courses.hasPrevious()}"
                               th:href="@{/lecturerPage(page=${courses.number - 1}, size=${courses.size})}"
                               class="px-3 py-1 border rounded text-gray-700 hover:bg-gray-100">Previous</a>

                            <span class="px-3 py-1 text-gray-500 font-medium">
        Page <span th:text="${courses.number + 1}"></span> of <span th:text="${courses.totalPages}"></span>
    </span>

                            <a th:if="${courses.hasNext()}"
                               th:href="@{/lecturerPage(page=${courses.number + 1}, size=${courses.size})}"
                               class="px-3 py-1 border rounded text-gray-700 hover:bg-gray-100">Next</a>
                        </div>

                    </div>
                </div>
            </div>
        </div>

    </main>

</div>

</body>
</html>
