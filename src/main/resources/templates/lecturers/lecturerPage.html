<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>
    Huge LMS Dashboard
  </title>
  <script src="https://cdn.tailwindcss.com">
  </script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;display=swap" rel="stylesheet"/>
</head>
<body class="bg-white text-gray-900">
<div class="flex min-h-screen">
  <!-- Sidebar -->
  <aside th:replace="~{fragments/sidebar_lecturer :: sidebar_lecturer}"></aside>
  <!-- Main content -->
  <main class="flex-1 p-6">
    <header th:replace="~{fragments/header_lecturer :: header_lecturer}"></header>
    <div>
      <nav class="flex items-center space-x-6 border-b border-gray-200 mb-6 justify-between">
        <button aria-current="page" class="flex items-center space-x-2 pb-3 border-b-2 border-black text-black font-semibold text-sm">
          <span>My Course</span>
          <span class="bg-gray-200 text-gray-600 text-xs font-semibold rounded-md px-2 py-0.5">12</span>
        </button>
        <div class="ml-auto flex items-center space-x-4">
          <a class="mr-4 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-md px-4 py-2 focus:outline-none" href="/createCourses">
            + CREATE
          </a>
        </div>
      </nav>
      <div class="overflow-x-auto border border-gray-200 rounded-md">
        <div class="relative overflow-y-auto max-h-96">
          <div th:if="${courses.isEmpty()}">
            <p>Bạn chưa tạo khóa học nào.</p>
          </div>
          <table th:unless="${courses.isEmpty()}" class="min-w-full divide-y divide-gray-200">
            <thead class="bg-white sticky top-0 z-10"> <tr>
              <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider" scope="col">
                COURSE
              </th>
              <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider" scope="col">
               CATEGORY
              </th>
              <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider" scope="col">
               TOPIC
              </th>
              <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider" scope="col">
               PRICE
              </th>
              <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider" scope="col">
               LEVEL
              </th>
              <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider" scope="col">
                STATUS
              </th>
              <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider" scope="col">
                ACTION
              </th>
            </tr>
            </thead>
          <tbody class="bg-white divide-y divide-gray-100 text-sm"> <tr th:each="course : ${courses}">
            <td class="px-6 py-4 whitespace-nowrap flex items-center space-x-4">
              <img alt="Blue abstract UI/UX design image for course" class="w-10 h-10 rounded" height="40" th:src="${course.image}" width="40"/>
              <span th:text="${course.title}" class="font-semibold text-gray-900 block truncate w-48"></span>
            </td>
            <td th:text="${course.category}" class="px-6 py-4 whitespace-nowrap text-gray-500"></td>
            <td th:text="${course.topic}" class="px-6 py-4 whitespace-nowrap text-gray-500"></td>
            <td th:text="${course.price} + '$'" class="px-6 py-4 whitespace-nowrap text-gray-500"></td>
            <td th:text="${course.level}" class="px-6 py-4 whitespace-nowrap text-gray-500"></td>
            <td class="px-3 py-4 whitespace-nowrap">
              <span class="inline-flex items-center space-x-1 text-xs font-semibold rounded-md px-2 py-1"
                th:classappend="${course.status == 'Published' ? 'bg-green-100 text-green-700' :
                                   (course.status == 'Waiting' ? 'bg-yellow-100 text-yellow-700' : 'bg-red-100 text-red-700')}">
              <svg aria-hidden="true" class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path th:if="${course.status == 'Published'}" d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"></path>
                <path th:if="${course.status == 'Waiting'}" d="M12 3v1m8 8h-1m-9 8v-1m2 1h-2M6 11V9m14 0v2m-3 4h1m-11 0h1m4-2v2m-4-2v2m-9-4h1m3 0h-3m0-6h1m-2 0h1m9-2v1m-7 0v1m-3 0h1m-1 0h1m2-2v2m-2-2v2M5 19h12a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                <path th:if="${course.status == 'Drafted'}" d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"></path>
              </svg>
              <span th:text="${course.status}"></span>
              </span>
            </td>
            <td class="py-3 pr-4 text-center">
              <a aria-label="Edit 1" class="text-blue-800 hover:text-blue-600" th:href="@{/updateCourses/{courseId}(courseId=${course.courseId})}">
                <i class="fas fa-edit"></i>
              </a>
              <a aria-label="Delete 1" class="text-red-800 hover:text-red-600 ml-2" th:href="@{/deleteCourses/{courseId}(courseId=${course.courseId})}">
                <i class="fas fa-trash-alt"></i>
              </a>
            </td>
          </tr>
          </tbody>
        </table>
        </div>
      </div>
    </div>
  </main>
</div>
<script>
  const dropdownButton = document.querySelector('.relative button');
  const dropdownMenu = document.querySelector('.relative div');

  dropdownButton.addEventListener('click', () => {
    dropdownMenu.classList.toggle('hidden');
  });

  // Đóng dropdown khi click ra ngoài
  document.addEventListener('click', (event) => {
    if (!dropdownButton.contains(event.target) && !dropdownMenu.contains(event.target)) {
      dropdownMenu.classList.add('hidden');
    }
  });
</script>
</body>
</html>
