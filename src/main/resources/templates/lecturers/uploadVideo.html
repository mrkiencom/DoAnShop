<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>
        Huge LMS Dashboard
    </title>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;display=swap" rel="stylesheet"/>
</head>
<body class="bg-white text-gray-900">
<div class="flex min-h-screen">
    <!-- Sidebar -->
    <aside th:replace="~{fragments/sidebar_lecturer :: sidebar_lecturer}"></aside>
    <!-- Main content -->
    <main class="flex-1 p-6">
        <header th:replace="~{fragments/header_lecturer :: header_lecturer}"></header>
        <form id="uploadVideoForm" class="mx-auto" th:action="@{/uploadVideo/{courseId}(courseId=${courseId})}" method="post" th:object="${video}">
            <h2 class="font-semibold text-[14px] mb-4">Upload Video for Course</h2>
            <div th:if="${createCourseSuccess}">
                <p class="text-green-500 text-sm mb-6">Create Course Success</p>
            </div>
            <div th:if="${uploadVideoSuccess}">
                <p class="text-green-500 text-sm mb-6">Upload Video Success!</p>
            </div>

            <div class="flex items-center space-x-10 mb-6 text-[11px] font-normal text-[#64748b]">
                <div class="flex items-center space-x-2">
                    <div class="w-5 h-5 rounded-full bg-[#3b82f6] flex items-center justify-center text-white text-[10px] font-semibold">
                        <i class="fas fa-check"></i>
                    </div>
                    <span class="text-[#3b82f6]">Course Landing</span>
                </div>
                <div class="flex items-center space-x-2">
                    <div class="w-5 h-5 rounded-full bg-[#3b82f6] flex items-center justify-center text-white text-[10px] font-semibold">
                        <i class="fas fa-check"></i>
                    </div>
                    <span class="text-[#3b82f6]">Upload video</span>
                </div>
            </div>

            <section class="bg-white rounded-lg p-6 mb-6 shadow-sm">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="font-semibold text-sm">Videos</h2>
                </div>
                <div class="bg-gray-100 rounded-md p-4 space-y-3">
                    <div>
                        <label class="block text-[9px] font-semibold text-[#64748b] tracking-wide mb-1">* TITLE</label>
                        <input
                                th:field="*{title}"
                                required=""
                                type="text"
                                class="w-full rounded-md border border-[#cbd5e1] px-3 py-2 text-[11px] text-[#1e293b] font-normal focus:outline-none focus:ring-1 focus:ring-[#2563eb]"/>
                    </div>
                    <div class="mt-6">
                        <label class="block text-[9px] font-semibold text-[#64748b] tracking-wide mb-1">* DESCRIPTION</label>
                        <textarea
                                th:field="*{description}"
                                required=""
                                rows="2"
                                class="w-full rounded-md border border-[#cbd5e1] px-3 py-2 text-[11px] text-[#1e293b] font-normal focus:outline-none focus:ring-1 focus:ring-[#2563eb]"
                        ></textarea>
                    </div>
                    <div class="flex justify-end items-center space-y-3 mt-5">
                        <button id="open-video-upload" class="text-xs text-indigo-600 border border-indigo-600 rounded-full px-3 py-1 flex items-center space-x-1 hover:bg-indigo-50 focus:outline-none focus:ring-2 focus:ring-indigo-600 " type="button">
                            <span>Upload Video</span>
                        </button>
                    </div>
                </div>
            </section>

            <section class="bg-white rounded-lg p-6 shadow-sm">
                <div class="grid mt-2">
                    <label class="block text-[9px] font-semibold text-[#64748b] mb-1 tracking-wide">* Video</label>
                    <div id="video-upload-container" class="image-upload-container border border-dashed border-gray-300 rounded-md bg-gray-100 h-72 flex items-center justify-center cursor-pointer">
                        <div id="no-video-overlay" class="text-center">
                            <i class="fas fa-video text-lg mb-1 text-gray-500"></i>
                            <span class="text-gray-500">Not video yet</span>
                        </div>
                        <video id="video-preview-thumb" th:src="${video.videoUrl != null and !video.videoUrl.isEmpty() ? video.videoUrl : '#'}" class="hidden max-h-full max-w-full" controls></video>
                        <input type="file" id="video-upload-input" class="hidden" accept="video/*" >
                    </div>
                    <p id="video-file-name-display" class="text-sm text-gray-500 mt-2 hidden"></p>
                    <p id="video-upload-message" class="text-sm mt-2"></p> <input type="hidden" id="videoUrl" name="videoUrl" th:field="*{videoUrl}" >
                    <input type="hidden" id="duration" name="duration" th:field="*{duration}" >
                </div>
            </section>

            <div class="flex justify-end items-center space-y-3 mt-6">
                <button id="saveVideoButton" class="text-xs text-indigo-600 border border-indigo-600 rounded-full px-3 py-1 flex items-center space-x-1 hover:bg-indigo-50 focus:outline-none focus:ring-2 focus:ring-indigo-600" type="submit">
                    <span> Save </span>
                </button>
            </div>
        </form>
    </main>
</div>
<script th:inline="javascript">
    const dropdownButton = document.querySelector('.relative button');
    const dropdownMenu = document.querySelector('.relative div');

    dropdownButton.addEventListener('click', () => {
        dropdownMenu.classList.toggle('hidden');
    });

    // Đóng dropdown khi click ra ngoài
    document.addEventListener('click', (event) => {
        if (!dropdownButton.contains(event.target) && !dropdownMenu.contains(event.target)) {
            dropdownMenu.classList.add('hidden');
        }
    });

    document.addEventListener('DOMContentLoaded', function() {
        const uploadVideoForm = document.getElementById('uploadVideoForm');
        const openVideoUploadButton = document.getElementById('open-video-upload');
        const videoUploadInput = document.getElementById('video-upload-input');
        const videoUploadContainer = document.getElementById('video-upload-container');
        const noVideoOverlay = document.getElementById('no-video-overlay');
        const videoPreviewThumb = document.getElementById('video-preview-thumb');
        const videoUrlInput = document.getElementById('videoUrl');
        const durationInput = document.getElementById('duration');
        const videoFileNameDisplay = document.getElementById('video-file-name-display');
        const videoUploadMessage = document.getElementById('video-upload-message');
        const saveVideoButton = document.getElementById('saveVideoButton');

        // Lấy courseId từ URL Thymeleaf
        const courseId = /*[[${courseId}]]*/ null;

        // --- Logic xem trước video và lấy thời lượng ---
        openVideoUploadButton.addEventListener('click', function() {
            videoUploadInput.click();
        });

        videoUploadInput.addEventListener('change', function(event) {
            const file = event.target.files[0];

            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    videoPreviewThumb.src = e.target.result;
                    videoPreviewThumb.classList.remove('hidden');
                    noVideoOverlay.classList.add('hidden');
                };
                reader.readAsDataURL(file);

                videoFileNameDisplay.textContent = `File đã chọn: ${file.name}`;
                videoFileNameDisplay.classList.remove('hidden');
                videoUploadMessage.textContent = ''; // Xóa thông báo cũ

                // Lấy thời lượng video
                videoPreviewThumb.onloadedmetadata = function() {
                    durationInput.value = this.duration.toFixed(2); // Lưu thời lượng làm số thập phân
                    console.log('Video Duration:', durationInput.value);
                };

                // Xóa URL và duration cũ nếu chọn file mới
                videoUrlInput.value = '';
                durationInput.value = '';

            } else {
                // Không có file nào được chọn
                // Kiểm tra nếu videoPreviewThumb đã có src từ database thì giữ nguyên
                if (videoPreviewThumb.src === '#' || videoPreviewThumb.src === window.location.href) {
                    videoPreviewThumb.classList.add('hidden');
                    noVideoOverlay.classList.remove('hidden');
                }
                videoFileNameDisplay.classList.add('hidden');
                videoFileNameDisplay.textContent = '';
                videoUploadMessage.textContent = '';
                // Không xóa videoUrlInput.value và durationInput.value ở đây để giữ lại dữ liệu cũ từ DB
            }
        });

        // --- Logic Tải video lên Cloudinary khi SUBMIT FORM ---
        uploadVideoForm.addEventListener('submit', async function(event) {
        event.preventDefault();
        saveVideoButton.disabled = true;
        saveVideoButton.textContent = 'Đang lưu video...';

        const file = videoUploadInput.files[0];
        if (!file && !videoUrlInput.value) {
            videoUploadMessage.textContent = 'Vui lòng chọn video.';
            videoUploadMessage.style.color = 'red';
            saveVideoButton.disabled = false;
            saveVideoButton.textContent = 'Save';
        return;
        }

    if (file) {
        videoUploadMessage.textContent = 'Đang tải lên Cloudinary...';
        try {
            const publicId = `course_${courseId}_video_${Date.now()}`.replace(/[^a-zA-Z0-9_-]/g, '_');
            console.log('DEBUG: Public ID =', publicId);
            const signatureResponse = await fetch(`/api/cloudinary/video-upload?folder=course_videos&publicId=${publicId}&resourceType=video`, {
                method: 'GET'
            });

            if (!signatureResponse.ok) {
                throw new Error('Lỗi lấy chữ ký: ' + await signatureResponse.text());
            }

            const signatureData = await signatureResponse.json();
            console.log('DEBUG: Signature Data =', signatureData);

            const cloudinaryFormData = new FormData();
            cloudinaryFormData.append('file', file);
            cloudinaryFormData.append('api_key', signatureData.api_key);
            cloudinaryFormData.append('timestamp', signatureData.timestamp);
            cloudinaryFormData.append('signature', signatureData.signature);
            cloudinaryFormData.append('folder', 'course_videos');
            cloudinaryFormData.append('public_id', publicId);
            cloudinaryFormData.append('resource_type', signatureData.resource_type);

            console.log('DEBUG: FormData Entries:');
            for (let [key, value] of cloudinaryFormData.entries()) {
                console.log(`${key}:`, value);
            }

            const cloudinaryUploadUrl = `https://api.cloudinary.com/v1_1/${signatureData.cloud_name}/${signatureData.resource_type}/upload`;
            console.log('DEBUG: Cloudinary URL =', cloudinaryUploadUrl);

            const cloudinaryResponse = await fetch(cloudinaryUploadUrl, {
                method: 'POST',
                body: cloudinaryFormData
            });

            if (cloudinaryResponse.ok) {
                const cloudinaryData = await cloudinaryResponse.json();
                videoUrlInput.value = cloudinaryData.secure_url;
                if (cloudinaryData.duration) {
                    durationInput.value = cloudinaryData.duration.toFixed(2);
                }
                videoUploadMessage.textContent = 'Video uploaded successfully!';
                videoUploadMessage.style.color = 'green';
            } else {
                const errorData = await cloudinaryResponse.json();
                console.error('DEBUG: Cloudinary Error =', errorData);
                throw new Error('Cloudinary Upload Error: ' + (errorData.error.message || 'Unknown'));
            }
        } catch (error) {
            console.error('Upload Error:', error);
            videoUploadMessage.textContent = 'Lỗi: ' + error.message;
            videoUploadMessage.style.color = 'red';
            saveVideoButton.disabled = false;
            saveVideoButton.textContent = 'Save';
            return;
        }
    }
    uploadVideoForm.submit();
});

    // Khởi tạo trạng thái ban đầu của video preview
    // Nếu video.videoUrl đã có giá trị từ model (khi chỉnh sửa hoặc tải lại trang)
    if (videoUrlInput.value && videoUrlInput.value !== '#') {
        videoPreviewThumb.src = videoUrlInput.value;
        videoPreviewThumb.classList.remove('hidden');
        noVideoOverlay.classList.add('hidden');
        videoFileNameDisplay.textContent = 'Video đã có sẵn.';
        videoFileNameDisplay.classList.remove('hidden');
    } else {
         // Đảm bảo trạng thái ban đầu nếu không có video
        videoPreviewThumb.classList.add('hidden');
        noVideoOverlay.classList.remove('hidden');
        videoFileNameDisplay.classList.add('hidden');
    }
    });
</script>
</body>
</html>
