<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>
        Huge LMS Dashboard
    </title>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;display=swap" rel="stylesheet"/>
</head>
<body class="bg-white text-gray-900">
<div class="flex min-h-screen">
    <!-- Sidebar -->
    <aside th:replace="~{fragments/sidebar_lecturer :: sidebar_lecturer}"></aside>
    <!-- Main content -->
    <main class="flex-1 p-6">
        <header th:replace="~{fragments/header_lecturer :: header_lecturer}"></header>
        <header class="border-b border-gray-300 pb-4 mb-6 text-center">
            <h2 class="text-xl font-semibold text-gray-900">Hồ sơ công khai</h2>
            <p class="text-sm text-gray-700 mt-1">Thêm thông tin về bản thân bạn</p>
        </header>
        <form class="max-w-4xl mx-auto" th:action="@{/profile_lecturer}" method="post" th:object="${updateProfileLecturer}">
            <div>
                <label class="block font-semibold text-gray-900 text-sm leading-5 my-4">Thông tin cơ bản:</label>
                <input
                        type="hidden"
                        id="user-id"
                        th:field="${lecturer_account.id}" />
                <input
                        type="text"
                        id="first-name"
                        name="first-name"
                        class="w-full border border-gray-300 rounded-md px-4 py-2 mb-3 text-gray-900"
                        placeholder="First Name"
                        th:field="${lecturer_account.firstname}"
                />
                <input
                        type="text"
                        id="last-name"
                        name="last-name"
                        class="w-full border border-gray-300 rounded-md px-4 py-2 mb-3 text-gray-900"
                        placeholder="Last Name"
                        th:field="${lecturer_account.lastname}"
                />
                <input
                        type="email"
                        id="gmail"
                        name="gmail"
                        class="w-full border border-gray-300 rounded-md px-4 py-2 mb-3 text-gray-900"
                        placeholder="Gmail"
                        th:field="${lecturer_account.gmail}"
                />
            </div>
            <div class="mt-2 text-sm text-green-500" th:text="${messageSuccessfully}"></div>
            <div class="mt-4 flex justify-end">
                <button class="bg-green-700 text-white font-semibold rounded-md px-6 py-3" type="submit">Lưu</button>
            </div>
        </form>
    </main>
</div>
<script>
    const dropdownButton = document.querySelector('.relative button');
    const dropdownMenu = document.querySelector('.relative div');
  
    dropdownButton.addEventListener('click', () => {
        dropdownMenu.classList.toggle('hidden');
    });
  
    // Đóng dropdown khi click ra ngoài
    document.addEventListener('click', (event) => {
        if (!dropdownButton.contains(event.target) && !dropdownMenu.contains(event.target)) {
            dropdownMenu.classList.add('hidden');
        }
    });
</script>
</body>
</html>
