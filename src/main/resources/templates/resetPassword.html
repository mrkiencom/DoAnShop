<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Create New Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
    />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');

        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-white flex items-center justify-center min-h-screen p-4">
<div class="bg-gray-50 rounded-xl p-6 max-w-sm w-full shadow-sm">
    <h2 class="text-gray-900 font-semibold text-base mb-1.5">Create New Password</h2>
    <p class="text-gray-400 text-xs mb-5 leading-tight">
        Please enter your new password below.
    </p>
    <form id="resetPasswordForm" th:action="@{/reset-password}" method="post" class="space-y-6">

        <!-- Hidden field to hold the token -->
        <input type="hidden" id="token" name="token"/>

        <div>
            <label for="new-password" class="block font-semibold text-gray-900 mb-1">New Password</label>
            <input
                    id="new-password"
                    name="newPassword"
                    type="password"
                    placeholder="Enter new password"
                    class="w-full border border-gray-300 rounded-md px-4 py-3 text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-green-600 focus:border-green-600"
            />
            <p id="newPasswordError" class="text-red-500 text-sm mt-1 hidden">Password must be at least 6 characters
                long.</p>
        </div>

        <div>
            <label for="confirm-password" class="block font-semibold text-gray-900 mb-1">Confirm Password</label>
            <input
                    id="confirm-password"
                    type="password"
                    placeholder="Re-enter new password"
                    class="w-full border border-gray-300 rounded-md px-4 py-3 text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-green-600 focus:border-green-600"
            />
            <p id="confirmPasswordError" class="text-red-500 text-sm mt-1 hidden">Passwords do not match.</p>
        </div>

        <div>
            <button type="submit"
                    class="w-full bg-green-700 text-white font-semibold rounded-md px-6 py-3 hover:bg-green-800 focus:outline-none focus:ring-2 focus:ring-green-600">
                Reset Password
            </button>
        </div>

        <!-- Optional: show message from server -->
        <div th:if="${messageChangePassword != null}">
            <div th:if="${messageChangePassword.contains('invalid')}"
                 class="mt-2 text-sm text-red-500"
                 th:text="${messageChangePassword}"></div>

            <div th:if="${!messageChangePassword.contains('invalid')}"
                 class="mt-2 text-sm text-green-500"
                 th:text="${messageChangePassword}"></div>
        </div>

    </form>
</div>

<script>
    // Lấy token từ URL
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");

    // Nếu có token thì set vào hidden field
    if (token) {
        document.getElementById('token').value = token;
    }

    // Validate khi submit
    document.getElementById('resetPasswordForm').addEventListener('submit', function (event) {
        const newPassword = document.getElementById('new-password').value;
        const confirmPassword = document.getElementById('confirm-password').value;
        const newPasswordError = document.getElementById('newPasswordError');
        const confirmPasswordError = document.getElementById('confirmPasswordError');

        let isValid = true;

        // Reset error messages
        newPasswordError.classList.add('hidden');
        confirmPasswordError.classList.add('hidden');

        // Check new password length
        if (newPassword.length < 6) {
            newPasswordError.classList.remove('hidden');
            isValid = false;
        }

        // Check if passwords match
        if (newPassword !== confirmPassword) {
            confirmPasswordError.classList.remove('hidden');
            isValid = false;
        }

        if (!isValid) {
            event.preventDefault(); // Prevent form submission
        }
    });
</script>
</body>
</html>
