<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>
        Email Sent Notification
    </title>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
<div class="bg-white rounded-xl shadow-md p-6 max-w-md w-full">
    <div class="flex items-start space-x-3">
        <div class="flex-shrink-0">
            <img alt="Green envelope icon representing email sent" class="w-6 h-6" height="24"
                 src="https://storage.googleapis.com/a1aa/image/71abd938-b3c6-4730-75c6-01dcdc26b29e.jpg" width="24"/>
        </div>
        <div class="flex-1">
            <h2 class="font-semibold text-gray-900 text-base mb-1">
                Email Sent
            </h2>
            <p class="text-gray-600 text-sm leading-relaxed mb-3">
                We have sent you an email. Please check your inbox and follow the instructions to reset your account
                password.
            </p>
            <a href="/" class="text-blue-600 hover:text-blue-800 underline transition-colors">
                Home
            </a>
        </div>
    </div>
</div>
</body>
</html>
