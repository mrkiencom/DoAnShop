<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Forgot Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
    />
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
<div class="bg-white rounded-xl p-6 w-full max-w-sm shadow-sm">
    <h2 class="text-gray-900 font-semibold text-base mb-2">Forgot Password</h2>
    <p class="text-gray-500 text-xs mb-5">
        Enter the email address you used to create the account, and we will email you instructions to reset your
        password.
    </p>
    <label for="email" class="text-gray-600 text-xs mb-1 block">Email Address</label>
    <form th:action="@{/send-email-reset-password}" method="post" onsubmit="handleSubmit(event)">
        <div class="relative mb-5">
      <span class="absolute inset-y-0 left-3 flex items-center text-gray-400 text-sm">
        <i class="fas fa-envelope"></i>
      </span>
            <input
                    id="email"
                    type="email"
                    name="email"
                    placeholder="Enter Email"
                    class="pl-10 pr-3 py-2 w-full border border-gray-300 rounded-md text-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent"
                    required
            />
        </div>
        <button
                type="submit"
                id="submitButton"
                class="w-full bg-blue-600 text-white text-sm font-semibold py-2 rounded-md hover:bg-blue-700 transition-colors flex items-center justify-center"
        >
            <span id="buttonText">Send Email</span>
            <svg id="spinner" class="ml-2 w-4 h-4 text-white animate-spin hidden" xmlns="http://www.w3.org/2000/svg"
                 fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor"
                      d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
            </svg>
        </button>
    </form>
    <p class="text-center text-gray-500 text-xs mt-4">
        Remember Password? <a href="/login" class="text-blue-600 hover:underline">Login</a>
    </p>

   
</div>

<script>
    function handleSubmit(event) {
        const button = document.getElementById('submitButton');
        const buttonText = document.getElementById('buttonText');
        const spinner = document.getElementById('spinner');

        buttonText.textContent = 'Sending...';
        spinner.classList.remove('hidden');

        button.disabled = true;
    }
</script>

</body>
</html>
