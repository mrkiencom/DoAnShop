<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>
        Password Reset
    </title>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;display=swap" rel="stylesheet"/>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-[#F3F6FF] min-h-screen flex items-center justify-center p-4">

<div th:if="${message != null}">
    <div th:if="${message.contains('failed')}"
         class="mt-2 text-sm text-red-500">

        <div class="bg-white max-w-sm w-full rounded-md shadow-md p-8 text-center relative">
            <p class="font-semibold text-red-600 text-base mb-2">
                Password reset failed
            </p>
            <p class="text-gray-600 text-xs mb-6 leading-tight">
                The reset link is invalid or has expired. Please try resetting your password again.
            </p>
            <button class="bg-[#2F54EB] text-white text-sm font-normal rounded w-full py-2" type="button">
                <a href="/forgot-password">Request New Reset Link</a>
            </button>
        </div>

    </div>

    <div th:if="${!message.contains('failed')}"
         class="mt-2 text-sm text-green-500">

        <div class="bg-white max-w-sm w-full rounded-md shadow-md p-8 text-center relative">
            <p class="font-semibold text-gray-900 text-base mb-2">
                Successful password reset!
            </p>
            <p class="text-gray-600 text-xs mb-6 leading-tight">
                You can now use your new password to log in to your account 🙌
            </p>
            <button class="bg-[#2F54EB] text-white text-sm font-normal rounded w-full py-2" type="button">
                <a href="login.html">Login</a>
            </button>
        </div>

    </div>
</div>


</body>
</html>
