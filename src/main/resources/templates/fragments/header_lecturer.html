<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<header class="flex items-center justify-between mb-6" th:fragment="header_lecturer">
  <h1 class="text-lg font-semibold text-gray-900 select-none" th:text="'Hello ' + ${lecturer_account.firstname} + ' ' + ${lecturer_account.lastname}">

  </h1>
  <div class="flex items-center gap-6">
    <button aria-label="Search" class="flex items-center gap-2 text-gray-500 hover:text-gray-900 text-sm">
      <i class="fas fa-search text-base">
      </i>
      Search
    </button>
    <button aria-label="Notifications" class="text-gray-500 hover:text-gray-900 text-lg" >
      <i class="fas fa-bell">
      </i>
    </button>
    <div class="relative">
      <button type="button">
        <img alt="User avatar with sunglasses and beard, circular crop" class="w-10 h-10 rounded-full object-cover" height="40" th:src="${lecturer_account.picture}" width="40"/>
      </button>
      <div class="z-50 absolute hidden top-12 right-0 w-[280px] bg-white shadow-md border border-gray-200 rounded-md font-mono-custom text-[10px] font-semibold">
        <div class="px-4 py-3 border-b border-gray-200 flex items-center justify-between">
          <div>
            <span class="text-black" th:text="${lecturer_account.firstname} + ' ' + ${lecturer_account.lastname}"></span>
            <span class="text-gray-600 uppercase tracking-widest mt-0.5" th:text="${lecturer_account.gmail}"></span>
          </div>
          <div>
            <span class="bg-[#e6ff00] text-[8px] font-extrabold uppercase px-2 py-0.5 rounded select-none" th:text="${lecturer_account.role}"></span>
          </div>
        </div>
        <ul class="divide-y divide-gray-200">
          <li class="flex items-center gap-2 px-4 py-3 hover:bg-gray-50 cursor-pointer">
            <a href="/image_lecturer">
              <i class="far fa-user-circle text-[12px]"></i>
              <span>Image settings</span>
            </a>
          </li>
          <li class="flex items-center gap-2 px-4 py-3 hover:bg-gray-50 cursor-pointer">
            <a href="/profile_lecturer">
              <i class="fas fa-user-edit text-[12px]"></i>
              <span>Profile settings</span>
            </a>
          </li>
          <li class="flex items-center gap-2 px-4 py-3 hover:bg-gray-50 cursor-pointer">
            <a href="/changePassword_lecturer">
              <i class="fas fa-lock text-[12px]"></i>
              <span>Change password</span>
            </a>
          </li>
          <li class="flex items-center gap-2 px-4 py-3 hover:bg-gray-50 cursor-pointer">
            <a href="/logout">
              <i class="fas fa-sign-out-alt text-[12px]"></i>
              <span>Sign out</span>
            </a>
          </li>
        </ul>
      </div>
    </div>
  </div>
</header>
</html>
