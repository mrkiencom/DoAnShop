<div th:fragment="content">

    <!-- Top cards -->
    <section class="flex flex-col sm:flex-row gap-6 ">
        <div class="flex-1 bg-[#3f57e0] rounded-2xl p-6 text-white w-full min-w-[180px] relative">
            <div class="flex justify-between items-center">
                <div>
                    <div class="flex items-center gap-3 font-semibold text-xl">
                        <i class="fas fa-graduation-cap"></i>
                        <span>Learner</span>
                    </div>
                    <p class="text-sm font-normal leading-tight mt-1">
                        Count of all learner
                    </p>
                </div>
                <p class="text-4xl font-extrabold drop-shadow-lg" id="learnerCount">0</p>
            </div>
        </div>
        <div class="flex-1 bg-[#a7b9f9] rounded-2xl p-6 text-[#2a3eb1] w-full  min-w-[180px] relative">
            <div class="flex items-center gap-3 font-semibold text-xl">
                <i class="fas fa-chalkboard-teacher">
                </i>
                <span>
                    Lecturer
                   </span>
            </div>
            <p class="mt-3 text-xs font-normal leading-tight">
                Count of all lecturer
            </p>
            <p class="text-4xl font-extrabold drop-shadow-lg" id="lecturerCount">0</p>
            <!-- Chart with bubble -->
            <svg class="absolute bottom-4 right-4 w-[140px] h-[60px]" fill="none" viewbox="0 0 140 60"
                 xmlns="http://www.w3.org/2000/svg">
                <path d="M0 40C20 20 40 40 60 30C80 20 100 40 120 30C140 20 140 40 140 40" stroke="#2a3eb1"
                      stroke-linecap="round" stroke-linejoin="round" stroke-width="3">
                </path>
                <rect fill="#a7b9f9" height="40" opacity="0.7" rx="10" width="30" x="80" y="10">
                </rect>
                <circle cx="95" cy="30" fill="white" r="8" stroke="#2a3eb1" stroke-width="2">
                </circle>
                <text fill="#fff" font-family="Inter, sans-serif" font-size="10" font-weight="600"
                      text-anchor="middle" x="95" y="20">
                </text>
                <text fill="#fff" font-family="Inter, sans-serif" font-size="10" font-weight="600"
                      text-anchor="middle" x="95" y="38">
                </text>
            </svg>

        </div>
        <div class="flex-1 bg-[#ff8a66] rounded-2xl p-6 text-white w-full min-w-[180px] relative">
            <div class="flex justify-between items-center">
                <div>
                    <div class="flex items-center gap-3 font-semibold text-xl">
                        <i class="fa-book-open"></i>
                        <span>Course</span>
                    </div>
                    <p class="text-sm font-normal leading-tight mt-1 flex items-center gap-2">
                        Count of all course
                    </p>
                </div>
                <p class="text-4xl font-extrabold drop-shadow-lg" id="courseCount">0</p>
            </div>
        </div>
    </section>

    <div style="width: 10px; height: 20px">

    </div>
    <!-- Bottom cards -->
    <section class="flex flex-col sm:flex-row gap-8 overflow-hidden">
        <!-- Registered Users -->
        <div th:fragment="usersListAndCount"
             class="flex-1 bg-white rounded-2xl p-3 shadow-inner flex flex-col">

            <!-- Header Users Count -->
            <div id="usersCount" th:fragment="usersCountFragment" class="flex items-center gap-2 mb-4">
                <div class="bg-[#a04a44] text-white rounded-full p-2 text-sm flex items-center justify-center"
                     style="width: 32px; height: 32px">
                    <i class="fas fa-user-friends"></i>
                </div>
                <span class="text-[#a04a44] font-semibold text-lg select-none"
                      th:text="${dashboard.users?.size()}">0</span>
                <span class="text-gray-700 text-sm select-none">users registered so far</span>
            </div>

            <!-- Tabs + TimeRange Select -->
            <div class="flex gap-6 border-b border-gray-200 mb-4 text-sm text-gray-400 select-none items-center">
                <button class="tab-button active-tab font-normal" type="button" id="usersTab">Users</button>
                <button class="tab-button inactive-tab font-normal" type="button" id="chartTab">Chart</button>

                <!-- Filter chỉ hiện khi tab là Users -->
                <div class="ml-auto relative" id="timeFilterContainer">
                    <select id="timeRangeSelect"
                            class="border border-gray-300 rounded-md text-xs py-1 px-2 cursor-pointer">
                        <option value="All" th:selected="${timeRangeUser == 'All'}">All</option>
                        <option value="lastWeek" th:selected="${timeRangeUser == 'lastWeek'}">Last Week</option>
                        <option value="lastMonth" th:selected="${timeRangeUser == 'lastMonth'}">Last Month</option>
                        <option value="lastYear" th:selected="${timeRangeUser == 'lastYear'}">Last Year</option>
                    </select>
                </div>
            </div>

            <!-- Nội dung chính (List hoặc Chart) -->
            <div id="userContainer" class="flex-1">
                <!-- User List -->
                <div id="userList" th:fragment="usersListAndCount"
                     class=" max-h-[200px] flex flex-col gap-4 overflow-y-auto scrollbar-thin pr-2 max-h-[300px] min-h-[300px]">
                    <div th:each="user : ${dashboard.users}" class="flex items-center gap-3">
                        <img th:src="${user.picture}" alt="Portrait of [[${user.fullName}]]"
                             class="rounded-full w-10 h-10 object-cover" width="40" height="40"/>
                        <div class="flex flex-col text-xs">
                            <span class="font-semibold text-gray-700 select-text" th:text="${user.fullName}"></span>
                            <span class="text-gray-400 select-text" th:text="${user.gmail}"></span>
                        </div>
                        <div class="flex items-center space-x-2 ml-auto">
                        <span class="text-gray-400 text-[10px] font-medium uppercase tracking-wide select-text"
                              th:text="${user.role}"></span>
                        </div>
                    </div>
                </div>

                <!-- Chart -->
                <div id="chartContent" style="display: none;"
                     class="flex items-center justify-center min-h-[300px] text-gray-500 text-sm">
                    <canvas id="usersChart" width="400" height="180"></canvas>
                </div>
            </div>
        </div>
    </section>


    <!-- Script: ĐỂ Ở CUỐI fragment -->
    <script>
        let selectedValue = document.getElementById("timeRangeSelect").value;

        function bindTabButtons() {
            document.querySelectorAll('.tab-button').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.tab-button').forEach(t => {
                        t.classList.remove('active-tab');
                        t.classList.add('inactive-tab');
                    });

                    tab.classList.add('active-tab');
                    tab.classList.remove('inactive-tab');

                    if (tab.id === 'usersTab') {
                        showUsers();
                    } else if (tab.id === 'chartTab') {
                        showChart();
                    }
                });
            });
        }

        function bindTimeRangeSelect() {
            const selectElement = document.getElementById("timeRangeSelect");
            if (selectElement) {
                selectElement.addEventListener("change", function () {
                    selectedValue = this.value;
                    showUsers();
                });
            }
        }

        function showUsers() {
            if (usersChartInstance) {
                usersChartInstance.destroy();
                usersChartInstance = null;
            }

            fetch(`/adminPage/users?timeRangeUser=${selectedValue}`)
                .then(response => response.text())
                .then(html => {
                    const tempDiv = document.createElement("div");
                    tempDiv.innerHTML = html;

                    // Lấy đúng .users-container
                    const newFragment = tempDiv.querySelector('#userList');
                    const container = document.querySelector('#userList');

                    if (container && newFragment) {
                        container.outerHTML = newFragment.outerHTML;

                        // Re-bind events
                        bindTabButtons();
                        bindTimeRangeSelect();
                    }

                    const newCountFragment = tempDiv.querySelector('#usersCount');
                    const oldCountFragment = document.querySelector('#usersCount');

                    if (oldCountFragment && newCountFragment) {
                        oldCountFragment.replaceWith(newCountFragment);
                    }

                    // Show userList, hide chart
                    const userList = document.getElementById('userList');
                    const chartContent = document.getElementById('chartContent');
                    if (userList && chartContent) {
                        userList.style.display = 'block';
                        chartContent.style.display = 'none';
                    }
                });
        }

        function showChart() {
            console.log(selectedValue);
            fetch(`/adminPage/usersChart?timeRangeUser=${selectedValue}`)
                .then(response => response.json())
                .then(data => {
                    renderUsersChart(data.labels, data.data);
                    console.log(data);
                });
            const userList = document.getElementById('userList');
            const chartContent = document.getElementById('chartContent');
            if (userList && chartContent) {
                userList.style.display = 'none';
                chartContent.style.display = 'block';
            }
        }

        let usersChartInstance = null;

        function renderUsersChart(labels, data) {
            const ctx = document.getElementById('usersChart').getContext('2d');

            if (usersChartInstance) {
                usersChartInstance.destroy();
                usersChartInstance = null;
            }

            usersChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Users per Month',
                        data: data,
                        backgroundColor: '#a04a44'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false
                }
            });
        }

        document.addEventListener("DOMContentLoaded", function () {
            fetch("/adminPage/card-count")
                .then(response => response.json())
                .then(data => {
                    document.getElementById("learnerCount").innerText = data.learner;
                    document.getElementById("lecturerCount").innerText = data.lecturer;
                    document.getElementById("courseCount").innerText = data.courses;
                });

            // Initial binding
            bindTabButtons();
            bindTimeRangeSelect();
        });

        const usersTabBtn = document.getElementById("usersTab");
        const chartTabBtn = document.getElementById("chartTab");
        const timeFilter = document.getElementById("timeFilterContainer");

        usersTabBtn.addEventListener("click", () => {
            usersTabBtn.classList.add("active-tab");
            chartTabBtn.classList.remove("active-tab");
            timeFilter.style.display = "block";
            // logic show tab content Users...
        });

        chartTabBtn.addEventListener("click", () => {
            chartTabBtn.classList.add("active-tab");
            usersTabBtn.classList.remove("active-tab");
            timeFilter.style.display = "none";
            // logic show tab content Chart...
        });
    </script>
</div>
