<div class="max-w-7xl w-[900px] mx-auto flex flex-col min-h-screen" th:fragment="content">

    <!-- HEADER -->
    <header class="flex flex-col sm:flex-row sm:items-center sm:justify-between mb-8">
        <div>
            <h1 class="font-extrabold text-2xl leading-tight mb-1">User</h1>
        </div>
    </header>

    <!-- FILTER TABS -->
    <section class="mb-6 flex flex-wrap gap-6 text-sm font-normal text-gray-700 w-[900px]">
        <button type="button" aria-current="true"
                class="flex items-center gap-2 font-semibold border-b-2 border-gray-900 pb-1"
                onclick="loadUsers('','','')"
        >
            <span>All</span>
            <span th:text="${countUser.all}" class=" bg-gray-800 text-white rounded-md px-2.5 py-0.5 text-xs
                  font-semibold select-none">168</span>
        </button>
        <button type="button" class="flex items-center gap-2 text-gray-700 hover:text-gray-900"
                onclick="loadUsers('learner','','')">
            <span>Learner</span>
            <span th:text="${countUser.learner}"
                  class="bg-green-100 text-green-700 rounded-md px-2.5 py-0.5 text-xs font-semibold select-none">142</span>
        </button>
        <button type="button" class="flex items-center gap-2 text-gray-700 hover:text-gray-900"
                onclick="loadUsers('lecturer','','')">
            <span>Lecturer</span>
            <span th:text="${countUser.lecturer}"
                  class="bg-yellow-100 text-yellow-600 rounded-md px-2.5 py-0.5 text-xs font-semibold select-none">24</span>
        </button>
        <button type="button" class="flex items-center gap-2 text-gray-700 hover:text-gray-900"
                onclick="loadUsers('admin','','')">
            <span>Admin</span>
            <span th:text="${countUser.admin}"
                  class="bg-red-100 text-red-600 rounded-md px-2.5 py-0.5 text-xs font-semibold select-none">2</span>
        </button>
    </section>

    <div th:fragment="listUserAfterClickButton">
        <!-- SEARCH + FILTER -->
        <section class="mb-6 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
            <div class="flex items-center w-full sm:w-[calc(100%-96px)] bg-white border border-gray-200 rounded-lg px-4 py-2 shadow-sm focus-within:ring-2 focus-within:ring-blue-600">
                <i class="fas fa-search text-gray-400 mr-3"></i>
                <input id="searchText" type="search" placeholder="Search..."
                       class="w-full text-sm text-gray-500 placeholder-gray-400 focus:outline-none"
                       aria-label="Search customers"
                       th:attr="onkeyup=|loadUsers('${filter}', '${status}', this.value)|"/>
            </div>
            <button type="button"
                    class="flex items-center gap-2 border border-gray-200 rounded-lg px-4 py-2 text-gray-400 text-sm hover:text-gray-600 hover:border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-600">
                <i class="fas fa-filter"></i>
                Filter
            </button>
        </section>


        <div class="w-[900px] mx-auto border border-gray-200 rounded-lg overflow-hidden">
            <!-- TABLE SECTION -->
            <section class="overflow-auto">
                <table class="w-full table-fixed border-collapse">
                    <thead class="bg-gray-200 text-gray-700 text-xs font-semibold text-left">
                    <tr>
                        <th class="p-3 pl-6 w-[5%]">
                            <input type="checkbox" aria-label="Select all customers"
                                   class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500"/>
                        </th>
                        <th class="p-3 w-[25%]">Name</th>
                        <th class="p-3 w-[25%]">Email</th>
                        <th class="p-3 w-[15%]">Role</th>
                        <th class="p-3 w-[20%]">Created At</th>
                        <th class="p-3 w-[10%]">Status</th>
                        <th class="p-3 w-[5%]"></th>
                    </tr>
                    </thead>

                    <tbody class="divide-y divide-gray-200 text-sm font-normal text-gray-900">
                    <tr th:each="user : ${usersPage.content}" class="hover:bg-gray-50 h-[52px] ">
                        <td class="p-3 pl-6">
                            <input type="checkbox" aria-label="Select User"/>
                        </td>
                        <td class="p-3">
                            <p class="font-semibold leading-tight" th:text="${user.fullName}">Name</p>
                        </td>
                        <td class="p-3">
                            <p class="text-gray-400 text-xs leading-tight select-text" th:text="${user.gmail}">Email</p>
                        </td>
                        <td class="p-3" th:text="${user.role}">Role</td>
                        <td class="p-3" th:text="${user.createdAt}">Created At</td>
                        <td class="p-3">
                    <span th:classappend="${user.status} ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-600'"
                          class="rounded-md px-2 py-0.5 text-xs font-semibold select-none"
                          th:text="${user.status} ? 'Active' : 'Unactive'">
                    </span>
                        </td>
                        <td class="p-3 text-center cursor-pointer text-gray-400 hover:text-gray-600">
                            <i class="fas fa-ellipsis-v"></i>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </section>

            <!-- FOOTER -->

        </div>

        <footer class="flex items-center justify-end space-x-6 text-xs text-gray-600 font-normal select-none px-4 py-3">
            <div th:text="${usersPage.number * usersPage.size + 1} + '-' + (${usersPage.number + 1}) * ${usersPage.size} + ' of ' + ${usersPage.totalElements}"></div>
            <button type="button"
                    aria-label="Previous page"
                    class="text-gray-400 hover:text-gray-600 [[${usersPage.first} ? 'disabled opacity-50 cursor-not-allowed' : '']]"
                    th:onclick="'window.location.href=\'?page=' + (${currentPage} - 1) + '&size=' + ${pageSize} + '\';'"
                    th:disabled="${usersPage.first}">
                <i class="fas fa-chevron-left"></i>
            </button>

            <button type="button"
                    aria-label="Next page"
                    class="text-gray-400 hover:text-gray-600 [[${usersPage.last} ? 'disabled opacity-50 cursor-not-allowed' : '']]"
                    th:onclick="'window.location.href=\'?page=' + (${currentPage} + 1) + '&size=' + ${pageSize} + '\';'"
                    th:disabled="${usersPage.last}">
                <i class="fas fa-chevron-right"></i>
            </button>
        </footer>

    </div>


    <script>
        function loadUsers(filter, status, text) {
            fetch(`/adminPage/fetch-user?filter=${filter}&status=${status}&text=${text}&page=0&size=7`)
                .then(response => response.text())
                .then(html => {
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');

                    const newTbody = doc.querySelector('tbody');
                    const newFooter = doc.querySelector('footer');

                    const tableTbody = document.querySelector('table tbody');
                    const footer = document.querySelector('footer');

                    // Update tbody
                    if (newTbody) {
                        tableTbody.innerHTML = newTbody.innerHTML;
                    } else {
                        tableTbody.innerHTML = '';
                    }

                    // Update footer
                    if (newFooter) {
                        footer.innerHTML = newFooter.innerHTML;
                    } else {
                        footer.innerHTML = '';
                    }
                });
        }

        function performSearch() {
            const text = document.getElementById('searchText').value;
            const filter = '${filter}';
            const status = '${status}';
            console.log({filter, status, text})
            loadUsers(filter, status, text);
        }
    </script>

</div>
