<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>
        ZON Dashboard
    </title>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;display=swap" rel="stylesheet"/>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        /* Scrollbar for user list */
        .scrollbar-thin::-webkit-scrollbar {
            width: 6px;
        }

        .scrollbar-thin::-webkit-scrollbar-track {
            background: transparent;
        }

        .scrollbar-thin::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 3px;
        }

        .active-tab {
            color: #a04a44;
            border-bottom: 2px solid #a04a44;
            font-weight: 600;
        }

        .inactive-tab {
            color: #9ca3af; /* tương đương text-gray-400 */
            border-bottom: none;
            font-weight: 400;
        }

        #userContainer {
            display: block; /* hoặc flex nếu cần */
            width: 100%;
        }

        #userList, #chartContent {
            width: 100%;
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-tr from-[#dbe5ff] to-[#f0f4ff] flex items-center justify-center p-6">
<div class="max-w-[1200px] w-full bg-white rounded-[32px] flex overflow-hidden shadow-lg rotate-[2deg] sm:rotate-0 sm:rounded-[32px]"
     style="aspect-ratio: 16 / 9">
    <!-- Sidebar -->
    <aside class="bg-gradient-to-b from-[#3f57e0] to-[#2a3eb1] w-56 flex flex-col justify-between p-6 rounded-l-[32px]">
        <div>
            <div class="flex items-center gap-2 mb-12">
                <div class="bg-white bg-opacity-20 rounded-full p-2">
                    <i class="fas fa-comment-alt text-white text-lg">
                    </i>
                </div>
                <span class="text-white font-semibold text-lg select-none">
       ZON
      </span>
            </div>
            <nav class="flex flex-col gap-4 text-white text-sm font-medium">
                <a class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-2xl transition-all duration-200 ease-in-out
               hover:scale-105 hover:shadow-lg"
                   href="/adminPage/dashboard">
                    <i class="fas fa-th-large text-white text-base"></i>
                    Dashboard
                </a>
                <a class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-2xl transition-all duration-200 ease-in-out
               hover:scale-105 hover:shadow-lg"
                   href="/adminPage/userPage">
                    <i class="fas fa-user text-white text-base"></i>
                    Users
                </a>
                <a class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-2xl transition-all duration-200 ease-in-out
               hover:scale-105 hover:shadow-lg"
                   href="/adminPage/course-page">
                    <i class="fas fa-graduation-cap text-white text-base"></i>
                    Course
                </a>
                <a class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-2xl transition-all duration-200 ease-in-out
               hover:scale-105 hover:shadow-lg"
                   href="#">
                    <i class="fas fa-users text-white text-base"></i>
                    Request
                </a>
                <a class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-2xl transition-all duration-200 ease-in-out
               hover:scale-105 hover:shadow-lg"
                   href="#">
                    <i class="fas fa-credit-card text-white text-base"></i>
                    Revenue
                </a>
            </nav>


        </div>
        <div>
            <a class="flex items-center gap-2 text-white text-sm font-medium hover:text-white/80 transition-colors"
               href="/logout">
                <i class="fas fa-sign-out-alt text-white text-base">
                </i>
                Log Out
            </a>
        </div>
    </aside>
    <!-- Main content -->
    <main class="flex-1 p-8 flex flex-col gap-8 overflow-hidden">
        <div th:replace="${contentTemplate} :: content"></div>
    </main>
</div>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        let currentPath = window.location.pathname;
        const links = document.querySelectorAll(".sidebar-link");
        console.log(currentPath)
        links.forEach(link => {
            const href = link.getAttribute("href");
            if (currentPath === '/adminPage') {
                currentPath = "/adminPage/dashboard";
            }
            // Nếu đúng path thì gắn class highlight
            if (currentPath === href || currentPath.startsWith(href)) {
                link.classList.add("bg-white", "bg-opacity-20", "rounded-2xl", "px-4", "py-3");
                link.classList.remove("transition-colors");

            } else {
                link.classList.remove("bg-white", "bg-opacity-20", "rounded-2xl", "px-4", "py-3");
                link.classList.add("transition-colors");
            }
        });
    });
</script>
</body>
</html>
