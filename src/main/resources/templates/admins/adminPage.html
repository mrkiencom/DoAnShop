<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>
        ZON Dashboard
    </title>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;display=swap" rel="stylesheet"/>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        /* Scrollbar for user list */
        .scrollbar-thin::-webkit-scrollbar {
            width: 6px;
        }

        .scrollbar-thin::-webkit-scrollbar-track {
            background: transparent;
        }

        .scrollbar-thin::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 3px;
        }

        .active-tab {
            color: #a04a44;
            border-bottom: 2px solid #a04a44;
            font-weight: 600;
        }

        .inactive-tab {
            color: #9ca3af; /* tương đương text-gray-400 */
            border-bottom: none;
            font-weight: 400;
        }

        #userContainer {
            display: block; /* hoặc flex nếu cần */
            width: 100%;
        }

        #userList, #chartContent {
            width: 100%;
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-tr from-[#dbe5ff] to-[#f0f4ff] flex items-center justify-center p-6">
<div class="max-w-[1200px] w-full bg-white rounded-[32px] flex overflow-hidden shadow-lg rotate-[2deg] sm:rotate-0 sm:rounded-[32px]"
     style="aspect-ratio: 16 / 9">
    <!-- Sidebar -->
    <aside class="bg-gradient-to-b from-[#3f57e0] to-[#2a3eb1] w-56 flex flex-col justify-between p-6 rounded-l-[32px]">
        <div>
            <div class="flex items-center gap-2 mb-12">
                <div class="bg-white bg-opacity-20 rounded-full p-2">
                    <i class="fas fa-comment-alt text-white text-lg">
                    </i>
                </div>
                <span class="text-white font-semibold text-lg select-none">
       ZON
      </span>
            </div>
            <nav class="flex flex-col gap-6 text-white text-sm font-medium">
                <a class="flex items-center gap-3 bg-white bg-opacity-20 rounded-2xl px-4 py-3" href="#">
                    <i class="fas fa-th-large text-white text-base">
                    </i>
                    Dashboard
                </a>
                <a class="flex items-center gap-3 hover:text-white transition-colors" href="#">
                    <i class="fas fa-cogs text-white text-base">
                    </i>
                    Learner
                </a>
                <a class="flex items-center gap-3 hover:text-white transition-colors" href="#">
                    <i class="fas fa-th text-white text-base">
                    </i>
                    Lecturer
                </a>
                <a class="flex items-center gap-3 hover:text-white transition-colors" href="#">
                    <i class="fas fa-comment-dots text-white text-base">
                    </i>
                    Course
                </a>
                <a class="flex items-center gap-3 hover:text-white transition-colors" href="#">
                    <i class="fas fa-users text-white text-base">
                    </i>
                    Workspace
                </a>
                <a class="flex items-center gap-3 hover:text-white transition-colors" href="#">
                    <i class="fas fa-credit-card text-white text-base">
                    </i>
                    Revenue
                </a>
            </nav>
        </div>
        <div>
            <a class="flex items-center gap-2 text-white text-sm font-medium hover:text-white/80 transition-colors"
               href="#">
                <i class="fas fa-sign-out-alt text-white text-base">
                </i>
                Log Out
            </a>
        </div>
    </aside>
    <!-- Main content -->
    <main class="flex-1 p-8 flex flex-col gap-8 overflow-hidden">
        <header>
            <h1 class="text-gray-400 font-normal text-lg select-none">
                Dashboard
            </h1>
        </header>
        <!-- Top cards -->
        <section class="flex flex-col sm:flex-row gap-6 ">
            <div class="flex-1 bg-[#3f57e0] rounded-2xl p-6 text-white max-w-xs min-w-[180px] relative">
                <div class="flex justify-between items-center">
                    <div>
                        <div class="flex items-center gap-3 font-semibold text-xl">
                            <i class="fas fa-graduation-cap"></i>
                            <span>Learner</span>
                        </div>
                        <p class="text-sm font-normal leading-tight mt-1">
                            Count of all learner
                        </p>
                    </div>
                    <p class="text-4xl font-extrabold drop-shadow-lg" id="learnerCount">0</p>
                </div>
            </div>
            <div class="flex-1 bg-[#a7b9f9] rounded-2xl p-6 text-[#2a3eb1] max-w-xs min-w-[180px] relative">
                <div class="flex items-center gap-3 font-semibold text-xl">
                    <i class="fas fa-chalkboard-teacher">
                    </i>
                    <span>
                    Lecturer
                   </span>
                </div>
                <p class="mt-3 text-xs font-normal leading-tight">
                    Count of all lecturer
                </p>
                <p class="text-4xl font-extrabold drop-shadow-lg" id="lecturerCount">0</p>
                <!-- Chart with bubble -->
                <svg class="absolute bottom-4 right-4 w-[140px] h-[60px]" fill="none" viewbox="0 0 140 60"
                     xmlns="http://www.w3.org/2000/svg">
                    <path d="M0 40C20 20 40 40 60 30C80 20 100 40 120 30C140 20 140 40 140 40" stroke="#2a3eb1"
                          stroke-linecap="round" stroke-linejoin="round" stroke-width="3">
                    </path>
                    <rect fill="#a7b9f9" height="40" opacity="0.7" rx="10" width="30" x="80" y="10">
                    </rect>
                    <circle cx="95" cy="30" fill="white" r="8" stroke="#2a3eb1" stroke-width="2">
                    </circle>
                    <text fill="#fff" font-family="Inter, sans-serif" font-size="10" font-weight="600"
                          text-anchor="middle" x="95" y="20">
                    </text>
                    <text fill="#fff" font-family="Inter, sans-serif" font-size="10" font-weight="600"
                          text-anchor="middle" x="95" y="38">
                    </text>
                </svg>

            </div>
            <div class="flex-1 bg-[#ff8a66] rounded-2xl p-6 text-white max-w-xs min-w-[180px] relative">
                <div class="flex justify-between items-center">
                    <div>
                        <div class="flex items-center gap-3 font-semibold text-xl">
                            <i class="fa-book-open"></i>
                            <span>Course</span>
                        </div>
                        <p class="text-sm font-normal leading-tight mt-1 flex items-center gap-2">
                            Count of all course
                        </p>
                    </div>
                    <p class="text-4xl font-extrabold drop-shadow-lg" id="courseCount">0</p>
                </div>
            </div>
        </section>

        <!-- Bottom cards -->
        <section class=" flex flex-col sm:flex-row gap-6 overflow-hidden">
            <!-- Registered Users -->
            <div th:fragment="usersListAndCount"
                 class="flex-1 bg-white rounded-2xl p-6 shadow-inner max-w-[600px] min-w-[280px] flex flex-col">
                <!-- Header Users Count -->
                <div id="usersCount" th:fragment="usersCountFragment" class="flex items-center gap-2 mb-4">
                    <div class="bg-[#a04a44] text-white rounded-full p-2 text-sm flex items-center justify-center"
                         style="width: 32px; height: 32px">
                        <i class="fas fa-user-friends"></i>
                    </div>
                    <span class="text-[#a04a44] font-semibold text-lg select-none"
                          th:text="${dashboard.users.size()}">0</span>
                    <span class="text-gray-700 text-sm select-none">
              users registered so far
        </span>
                </div>

                <!-- Tabs + TimeRange Select -->
                <div class="flex gap-6 border-b border-gray-200 mb-4 text-sm text-gray-400 select-none">
                    <button class="tab-button active-tab font-normal"
                            type="button" id="usersTab">
                        Users
                    </button>
                    <button class="tab-button inactive-tab font-normal" type="button" id="chartTab">
                        Chart
                    </button>
                    <div class="ml-auto relative">
                        <select id="timeRangeSelect"
                                class="border border-gray-300 rounded-md text-xs py-1 px-2 cursor-pointer">
                            <option value="lastMonth" th:selected="${timeRangeUser == 'lastMonth'}">Last
                                Month
                            </option>
                            <option value="lastWeek" th:selected="${timeRangeUser == 'lastWeek'}">Last
                                Week
                            </option>
                            <option value="lastYear" th:selected="${timeRangeUser == 'lastYear'}">Last
                                Year
                            </option>
                        </select>
                    </div>
                </div>

                <!-- List Users -->
                <div id="userContainer">
                    <div id="userList" th:fragment="userListFragment"
                         class="flex flex-col gap-4 overflow-y-auto scrollbar-thin max-h-[180px] pr-2">
                        <div th:each="user : ${dashboard.users}" class="flex items-center gap-3">
                            <img th:src="${user.picture}" alt="Portrait of [[${user.fullName}]]"
                                 class="rounded-full w-10 h-10 object-cover" width="40" height="40"/>
                            <div class="flex flex-col text-xs">
                                            <span class="font-semibold text-gray-700 select-text"
                                                  th:text="${user.fullName}"></span>
                                <span class="text-gray-400 select-text" th:text="${user.gmail}"></span>
                            </div>
                            <div class="flex items-center space-x-2 ml-auto">
                      <span class="text-gray-400 text-[10px] font-medium uppercase tracking-wide select-text"
                            th:text="${user.role}"></span>
                            </div>
                        </div>
                    </div>
                    <!-- Chart Users -->
                    <div id="chartContent" style="display: none;"
                         class="flex flex-col items-center justify-center h-[180px] text-gray-500 text-sm">
                        <canvas id="usersChart" width="400" height="180"></canvas>
                    </div>
                </div>

            </div>


            <!-- course -->
            <div class="flex-1 bg-white rounded-2xl p-6 shadow-inner max-w-[600px] min-w-[280px] flex flex-col">
                <div class="flex items-center gap-2 mb-4">
                    <div class="bg-[#a04a44] text-white rounded-full p-2 text-sm flex items-center justify-center"
                         style="width: 32px; height: 32px">
                        <i class="fas fa-user-friends">
                        </i>
                    </div>
                    <span class="text-[#a04a44] font-semibold text-lg select-none"
                          th:text="${dashboard.courses.size()}">0
       </span>
                    <span class="text-gray-700 text-sm select-none">
        Count of courses
       </span>
                </div>
                <div class="flex gap-6 border-b border-gray-200 mb-4 text-sm text-gray-400 select-none">
                    <button class="font-normal" type="button">
                        Total
                    </button>
                    <button class="pb-1 border-b-2 border-[#a04a44] text-[#a04a44] font-semibold"
                            type="button">
                        Chart
                    </button>
                    <div class="ml-auto relative">
                        <select aria-label="Select time range"
                                class="border border-gray-300 rounded-md text-xs py-1 px-2 cursor-pointer">
                            <option>
                                Last Week
                            </option>
                            <option>
                                Last Month
                            </option>
                            <option>
                                Last Year
                            </option>
                        </select>
                    </div>
                </div>
                <div class="flex-1">
                    <svg class="w-full h-[120px]" fill="none" viewbox="0 0 300 120"
                         xmlns="http://www.w3.org/2000/svg">
                        <path d="M0 90C30 40 60 80 90 70C120 60 150 100 180 50C210 0 240 90 270 80C300 70 300 90 300 90V120H0V90Z"
                              fill="#ff8a66" fill-opacity="0.15">
                        </path>
                        <path d="M0 90C30 40 60 80 90 70C120 60 150 100 180 50C210 0 240 90 270 80C300 70 300 90 300 90"
                              stroke="#ff8a66" stroke-linecap="round" stroke-linejoin="round"
                              stroke-width="2">
                        </path>
                        <circle cx="30" cy="40" fill="#ff8a66" r="3">
                        </circle>
                        <circle cx="90" cy="70" fill="#ff8a66" r="3">
                        </circle>
                        <circle cx="150" cy="100" fill="#ff8a66" r="3">
                        </circle>
                        <circle cx="210" cy="0" fill="#ff8a66" r="3">
                        </circle>
                        <circle cx="240" cy="90" fill="#ff8a66" r="3">
                        </circle>
                        <circle cx="270" cy="80" fill="#ff8a66" r="3">
                        </circle>
                    </svg>
                    <div class="flex justify-between text-xs text-gray-400 mt-1 select-none">
        <span>
         0
        </span>
                        <span>
         50
        </span>
                        <span>
         100
        </span>
                        <span>
         150
        </span>
                        <span>
         200
        </span>
                    </div>
                </div>
            </div>
        </section>
    </main>
</div>


<script>
    let selectedValue = document.getElementById("timeRangeSelect").value;

    document.getElementById("timeRangeSelect").addEventListener("change", function () {
        selectedValue = this.value;
        showUsers();
    });

    function showUsers() {
        if (usersChartInstance) {
            usersChartInstance.destroy();
            usersChartInstance = null;
        }

        fetch(`/adminPage/users?timeRangeUser=${selectedValue}`)
            .then(response => response.text())
            .then(html => {
                const tempDiv = document.createElement("div");
                tempDiv.innerHTML = html;

                const newCount = tempDiv.querySelector("#usersCount");
                document.getElementById("usersCount").outerHTML = newCount.outerHTML;

                const newList = tempDiv.querySelector("#userList");
                document.getElementById("userList").outerHTML = newList.outerHTML;

                document.getElementById('userCountValue').style.display = 'inline';
                document.getElementById('userCountLabel').textContent = 'Count of Registered Users';
                document.getElementById('userListHeader').style.display = 'flex';

                document.getElementById('chartContent').style.display = 'none';
                document.getElementById('userList').style.display = 'block';

            });
    }

    function showChart() {
        fetch(`/adminPage/usersChart?timeRangeUser=${selectedValue}`)
            .then(response => response.json())
            .then(data => {
                renderUsersChart(data.labels, data.data);
            });

        document.getElementById('userList').style.display = 'none';
        document.getElementById('chartContent').style.display = 'block';

        document.getElementById('userCountValue').style.display = 'none';
        document.getElementById('userCountLabel').textContent = 'Chart for Users';
        document.getElementById('userListHeader').style.display = 'flex';
    }

    document.querySelectorAll('.tab-button').forEach(tab => {
        tab.addEventListener('click', () => {
            // Xóa active khỏi tất cả
            document.querySelectorAll('.tab-button').forEach(t => {
                t.classList.remove('active-tab');
                t.classList.add('inactive-tab');
            });
            // Thêm active cho tab hiện tại
            tab.classList.add('active-tab');
            tab.classList.remove('inactive-tab');

            // Logic hiển thị nội dung tương ứng
            if (tab.id === 'usersTab') {
                showUsers();
            } else if (tab.id === 'chartTab') {
                showChart();
            }
        });
    });

    let usersChartInstance = null;

    function renderUsersChart(labels, data) {
        const ctx = document.getElementById('usersChart').getContext('2d');

        // Destroy old chart if exists
        if (usersChartInstance) {
            usersChartInstance.destroy();
            usersChartInstance = null;
        }

        usersChartInstance = new Chart(ctx, {
            type: 'bar', // hoặc 'line' tùy ý
            data: {
                labels: labels,
                datasets: [{
                    label: 'Users per Month',
                    data: data,
                    backgroundColor: '#a04a44'
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false
            }
        });
    }

    document.addEventListener("DOMContentLoaded", function () {
        fetch("/adminPage/card-count")
            .then(response => response.json())
            .then(data => {
                document.getElementById("learnerCount").innerText = data.learner;
                document.getElementById("lecturerCount").innerText = data.lecturer;
                document.getElementById("courseCount").innerText = data.courses;
            });
    });

</script>

</body>
</html>
