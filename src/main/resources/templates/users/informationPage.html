<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Profile Page</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link
          rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
  />
</head>
<header th:replace="~{fragments/header :: header}"></header>
<body class="bg-white">
<div class="max-w-6xl mx-auto border border-gray-300 mt-6 flex flex-col md:flex-row min-h-[600px]">
  <!-- Left Sidebar -->
  <aside class="w-full md:w-64 border-r border-gray-300 flex flex-col items-center py-8">
    <img class="flex items-center justify-center w-32 h-32 rounded-full bg-gray-900 text-white font-extrabold text-3xl"
         th:src="${user_account.picture}" alt="User initials CP">
    <h3 class="mt-3 font-semibold text-center text-gray-900" th:text="${user_account.firstname} + ' ' + ${user_account.lastname}"></h3>
    <nav class="mt-6 w-full text-gray-900 text-base font-normal">
      <ul class="flex flex-col w-full">
        <li class="px-4 py-1 cursor-pointer hover:bg-gray-200">
          <a href="/profile" class="block w-full h-full">Ảnh</a>
        </li>
        <li class="px-4 py-1 cursor-pointer hover:bg-gray-200">
          <a href="/information" class="block w-full h-full">Hồ sơ</a>
        </li>
        <li class="px-4 py-1 cursor-pointer hover:bg-gray-200">
          <a href="/change_password" class="block w-full h-full">Đổi mật khẩu</a>
        </li>
        <li class="px-4 py-1 cursor-pointer hover:bg-gray-200">
          <a href="/logout" class="block w-full h-full">Đăng xuất</a>
        </li>
      </ul>
    </nav>
  </aside>

  <!-- Right Content -->
  <main class="flex-1 p-6">
    <header class="border-b border-gray-300 pb-4 mb-6 text-center">
      <h2 class="text-xl font-semibold text-gray-900">Hồ sơ công khai</h2>
      <p class="text-sm text-gray-700 mt-1">Thêm thông tin về bản thân bạn</p>
    </header>
    <form class="max-w-4xl mx-auto" th:action="@{/information}" method="post" th:object="${updateInformation}">
      <div>
        <label class="block font-semibold text-gray-900 text-sm leading-5 my-4">Thông tin cơ bản:</label>
        <input
                type="hidden"
                id="user-id"
                th:field="${user_account.id}" />
        <input
                type="text"
                id="first-name"
                name="first-name"
                class="w-full border border-gray-300 rounded-md px-4 py-2 mb-3 text-gray-900"
                placeholder="First Name"
                th:field="${user_account.firstname}"
        />
        <input
                type="text"
                id="last-name"
                name="last-name"
                class="w-full border border-gray-300 rounded-md px-4 py-2 mb-3 text-gray-900"
                placeholder="Last Name"
                th:field="${user_account.lastname}"
        />
        <input
                type="email"
                id="gmail"
                name="gmail"
                class="w-full border border-gray-300 rounded-md px-4 py-2 mb-3 text-gray-900"
                placeholder="Gmail"
                th:field="${user_account.gmail}"
        />
      </div>
      <div class="mt-2 text-sm text-green-500" th:text="${messageSuccessfully}"></div>
      <div class="mt-4 flex justify-end">
        <button class="bg-green-700 text-white font-semibold rounded-md px-6 py-3" type="submit">Lưu</button>
      </div>
    </form>
  </main>
</div>
<script>
  const dropdownButton = document.querySelector('.relative button');
  const dropdownMenu = document.querySelector('.relative div');

  dropdownButton.addEventListener('click', () => {
      dropdownMenu.classList.toggle('hidden');
  });

  // Đóng dropdown khi click ra ngoài
  document.addEventListener('click', (event) => {
      if (!dropdownButton.contains(event.target) && !dropdownMenu.contains(event.target)) {
          dropdownMenu.classList.add('hidden');
      }
  });
</script>
</body>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</html>
