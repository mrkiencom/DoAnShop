<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>Cart</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
</head>
<header th:replace="~{fragments/header :: header}"></header>
<main class="max-w-7xl mx-auto px-6 mt-10 mb-10">
    <h1 class="text-3xl font-extrabold text-gray-900 mb-6">Shopping Cart</h1>
    <div th:if="${coursesListCart == null or coursesListCart.isEmpty()}">
        <h2 class="font-semibold text-gray-900 mb-4">
            0 Courses in Cart
        </h2>
        <section class="border border-gray-200 rounded-md p-10 flex flex-col items-center justify-center space-y-6">
            <img alt="Illustration of a person looking at floating course icons including a book, video, and image"
                 class="w-[150px] h-[100px]" height="100"
                 src="https://storage.googleapis.com/a1aa/image/d81fc3f3-26c7-4802-fca7-7d26f2ef23d4.jpg" width="150"/>
            <p class="text-gray-900 text-center text-sm">
                Your cart is empty. Keep shopping to find a course!
            </p>
            <a class="bg-purple-700 text-white font-semibold rounded px-6 py-3 hover:bg-purple-800" href="/listCourses">
                Keep shopping
            </a>
        </section>
    </div>
    <div th:unless="${coursesListCart == null or coursesListCart.isEmpty()}">
        <section class="flex flex-col lg:flex-row lg:space-x-12">
            <!-- Left: Courses list -->
            <div class="flex-1">
                <h2 class="font-semibold text-gray-800 mb-4"
                    th:text="${coursesListCart.size()} + ' Courses in Cart'"></h2>
                <div class="overflow-y-auto max-h-96">
                    <!-- Course 1 -->
                    <article th:each="cart : ${coursesListCart}"
                             class="flex items-start space-x-6 mb-8 border-b border-gray-300 pb-6">
                        <img th:src="${cart.course.image}"
                             alt="Course thumbnail showing a woman holding a phone with iOS app icons on screen"
                             class="w-40 h-24 object-cover flex-shrink-0 rounded-sm" height="90" width="160"/>
                        <div class="flex-1">
                            <h3 class="font-semibold text-gray-900 text-base leading-tight mb-2"
                                th:text="${cart.course.title}"></h3>
                            <p class="text-xs text-gray-700 mb-2"
                               th:text="'By ' + ${cart?.course?.lecturer?.firstname} + ' ' + ${cart.course?.lecturer?.lastname} + ', ' + ${cart.course?.category} + ' and ' + ${cart.course?.topic}">
                                ></p>
                            <div class="text-xs text-gray-600 mb-2" th:text="'• ' + ${cart.course?.level}">
                            </div>
                            <div class="text-xs text-gray-600 mb-2">
                                <i class="fas fa-sync-alt text-gray-900"></i>
                                <span th:text="'Last updated : ' + ${cart.course.date}"></span>
                            </div>
                        </div>
                        <div class="flex flex-col items-end space-y-2 text-sm text-green-600">
                            <a class="hover:underline" th:href="@{/removeItemCart/{cartId}(cartId=${cart.cartId})}">Remove</a>
                        </div>
                        <div class="flex flex-col items-end ml-6 space-y-1 text-right text-gray-900 font-semibold">
                            <div class="flex items-center space-x-1">
                                <span th:id="'coursePrice-'" th:text="${cart.course.price} + ' ₫'"></span>
                                <i class="fas fa-tag text-green-600"></i>
                            </div>
                        </div>
                    </article>
                </div>
            </div>
            <!-- Right: Summary -->
            <aside class="w-full max-w-sm mt-12 lg:mt-0">
                <div class="text-gray-900 font-semibold mb-1">Tổng cộng:</div>
                <div class="text-3xl font-extrabold text-gray-900 mb-5 " th:id="'coursePrice-'"
                     th:text="${totalPrice} + ' ₫'"></div>

                <form th:action="@{/payForCart}" method="post">
                    <div th:each="listCart : ${coursesListCart}">
                        <input type="hidden" name="courseIds" th:value="${listCart.course.courseId}"/>
                    </div>

                    <button type="submit"
                            class="w-full bg-green-700 text-white font-semibold rounded-md py-3 mb-6 hover:bg-green-800 flex items-center justify-center space-x-2">
                        <span>Tiến hành thanh toán</span>
                        <i class="fas fa-arrow-right"></i>
                    </button>
                </form>
            </aside>
        </section>
    </div>
</main>
<script th:inline="javascript">
    // Get all course price elements
    document.querySelectorAll('[id^="coursePrice-"]').forEach(element => {
        const price = Number(element.textContent.replace(' ₫', '')) || 0;
        element.textContent = new Intl.NumberFormat('vi-VN', {
            style: 'currency',
            currency: 'VND'
        }).format(price);
    });
</script>
<script>
    const dropdownButton = document.querySelector('.relative button');
    const dropdownMenu = document.querySelector('.relative div');

    dropdownButton.addEventListener('click', () => {
        dropdownMenu.classList.toggle('hidden');
    });

    // Đóng dropdown khi click ra ngoài
    document.addEventListener('click', (event) => {
        if (!dropdownButton.contains(event.target) && !dropdownMenu.contains(event.target)) {
            dropdownMenu.classList.add('hidden');
        }
    });
</script>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</html>
