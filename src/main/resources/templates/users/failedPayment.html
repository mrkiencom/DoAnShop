<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thanh toán thất bại</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center px-4">

<div class="bg-white shadow-xl rounded-2xl p-8 max-w-lg w-full text-center">
    <!-- Icon lỗi -->
    <div class="mx-auto mb-6 w-16 h-16 rounded-full bg-red-100 flex items-center justify-center">
        <svg class="w-8 h-8 text-red-600" fill="none" stroke="currentColor" stroke-width="2"
             viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M12 9v2m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
    </div>

    <!-- Nội dung chính -->
    <h1 class="text-2xl font-bold text-gray-800 mb-2">Thanh toán thất bại</h1>
    <p class="text-gray-600 mb-6">
        Rất tiếc! Giao dịch của bạn không thành công hoặc đã bị hủy. Vui lòng thử lại sau.
    </p>

    <!-- Nút quay lại -->
    <a href="/"
       class="inline-block px-6 py-2 bg-red-500 text-white rounded-full hover:bg-red-600 transition duration-200">
        Quay về trang chủ
    </a>
</div>

</body>
</html>
