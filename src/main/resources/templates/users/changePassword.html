<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Profile Page</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link
          rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
  />
</head>
<header th:replace="~{fragments/header :: header}"></header>
<body class="bg-white">
<div class="max-w-6xl mx-auto border border-gray-300 mt-6 flex flex-col md:flex-row min-h-[600px]">
  <!-- Left Sidebar -->
  <aside class="w-full md:w-64 border-r border-gray-300 flex flex-col items-center py-8">
    <img class="flex items-center justify-center w-32 h-32 rounded-full bg-gray-900 text-white font-extrabold text-3xl"
         th:src="${user_account.picture}" alt="User initials CP">
    <h3 class="mt-3 font-semibold text-center text-gray-900" th:text="${user_account.firstname} + ' ' + ${user_account.lastname}"></h3>
    <nav class="mt-6 w-full text-gray-900 text-base font-normal">
      <ul class="flex flex-col w-full">
        <li class="px-4 py-1 cursor-pointer hover:bg-gray-200">
          <a href="/profile" class="block w-full h-full">Ảnh</a>
        </li>
        <li class="px-4 py-1 cursor-pointer hover:bg-gray-200">
          <a href="/information" class="block w-full h-full">Hồ sơ</a>
        </li>
        <li class="px-4 py-1 cursor-pointer hover:bg-gray-200">
          <a href="/change_password" class="block w-full h-full">Đổi mật khẩu</a>
        </li>
        <li class="px-4 py-1 cursor-pointer hover:bg-gray-200">
          <a href="/logout" class="block w-full h-full">Đăng xuất</a>
        </li>
      </ul>
    </nav>
  </aside>

  <!-- Right Content -->
  <main class="flex-1 border-l border-gray-300">
    <header class="border-b border-gray-300 p-6 text-center">
      <h1 class="text-xl font-extrabold text-gray-900">Tài khoản</h1>
      <p class="mt-2 text-gray-900 text-sm max-w-xl mx-auto">
        Chỉnh sửa chế độ cài đặt tài khoản và thay đổi mật khẩu của bạn tại đây.
      </p>
    </header>

    <section class="p-6 border-gray-300">
      <form id="changePasswordForm" th:action="@{/change_password}" th:object="${changePasswordDto}" method="post" class="max-w-3xl mx-auto space-y-6">
        <div>
          <label for="email" class="block font-semibold text-gray-900 mb-1">Email:</label>
          <input
                  type="hidden"
                  id="user-id"
                  th:field="${user_account.id}" />

          <div class="flex items-center gap-3">
            <input
                    id="email"
                    type="text"
                    readonly
                    th:value="'Địa chỉ email của bạn là '+ ${user_account.gmail}"
                    class="flex-1 border border-gray-300 rounded-md px-4 py-3 text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:border-indigo-600"
            />
          </div>
        </div>

        <div>
          <label for="new-password" class="block font-semibold text-gray-900 mb-1">
            Mật khẩu mới
          </label>
          <input
                  id="new-password"
                  type="password"
                  placeholder="Nhập mật khẩu mới"
                  class="w-full border border-gray-300 rounded-md px-4 py-3 text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-green-600 focus:border-green-600"
          />
          <p id="newPasswordError" class="text-red-500 text-sm mt-1 hidden">Mật khẩu mới phải có ít nhất 6 ký tự.</p>
        </div>

        <div>
          <label for="confirm-password" class="block font-semibold text-gray-900 mb-1">
            Xác nhận mật khẩu mới
          </label>
          <input
                  id="confirm-password"
                  type="password"
                  placeholder="Nhập lại mật khẩu mới"
                  th:field="*{password}"
                  class="w-full border border-gray-300 rounded-md px-4 py-3 text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-green-600 focus:border-green-600"
          />
          <p id="confirmPasswordError" class="text-red-500 text-sm mt-1 hidden">Mật khẩu xác nhận không khớp.</p>
        </div>
        <div class="mt-2 text-sm text-green-500" th:text="${messageChangePassword}"></div>
        <div>
          <button type="submit" class="bg-green-700 text-white font-semibold rounded-md px-6 py-3 hover:bg-green-800 focus:outline-none focus:ring-2 focus:ring-green-600">Đổi mật khẩu</button>
        </div>
      </form>
    </section>
  </main>
</div>
<script>
  const dropdownButton = document.querySelector('.relative button');
  const dropdownMenu = document.querySelector('.relative div');

  dropdownButton.addEventListener('click', () => {
      dropdownMenu.classList.toggle('hidden');
  });

  // Đóng dropdown khi click ra ngoài
  document.addEventListener('click', (event) => {
      if (!dropdownButton.contains(event.target) && !dropdownMenu.contains(event.target)) {
           dropdownMenu.classList.add('hidden');
      }
  });

  document.getElementById('changePasswordForm').addEventListener('submit', function(event) {
        const newPassword = document.getElementById('new-password').value;
        const confirmPassword = document.getElementById('confirm-password').value;
        const newPasswordError = document.getElementById('newPasswordError');
        const confirmPasswordError = document.getElementById('confirmPasswordError');

        let isValid = true;

        // Reset error messages
        newPasswordError.classList.add('hidden');
        confirmPasswordError.classList.add('hidden');

        // Check new password length
        if (confirmPassword.length < 6) {
            newPasswordError.classList.remove('hidden');
            isValid = false;
        }

        // Check if passwords match
        if (newPassword !== confirmPassword) {
            confirmPasswordError.classList.remove('hidden');
            isValid = false;
        }

        if (!isValid) {
            event.preventDefault(); // Prevent form submission
        }
   });
</script>
</body>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</html>
